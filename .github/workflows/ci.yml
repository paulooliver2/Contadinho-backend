name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testes de integração usam Testcontainers (Postgres real); o runner já tem Docker.
      - run: ./mvnw -B verify
      - name: Contrato OpenAPI commitado está em dia
        run: git diff --exit-code openapi.json
