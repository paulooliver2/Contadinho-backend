spring.application.name=contadinho-api

# Esquema só muda por migração Flyway (RNF-06); o Hibernate apenas confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Datas de negócio seguem America/Sao_Paulo (ver comum.Relogio).
contadinho.fuso=America/Sao_Paulo

# Segredo HS256 com pelo menos 32 bytes. Em produção vem só da variável de ambiente (RNF-03).
contadinho.jwt.secret=${JWT_SECRET}
contadinho.jwt.access-ttl=15m
contadinho.jwt.refresh-ttl=30d

contadinho.cors.origens=https://localhost

# openapi.json formatado, para o diff do contrato ser legível.
springdoc.writer-with-default-pretty-printer=true

management.endpoints.web.exposure.include=health
