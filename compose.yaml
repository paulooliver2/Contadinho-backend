# Banco local. O `./mvnw spring-boot:run` sobe este serviço sozinho (spring-boot-docker-compose).
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=contadinho'
      - 'POSTGRES_USER=contadinho'
      - 'POSTGRES_PASSWORD=contadinho'
      - 'TZ=America/Sao_Paulo'
    ports:
      - '5432:5432'
    volumes:
      - 'contadinho-db:/var/lib/postgresql'  # a imagem 18 guarda os dados em /var/lib/postgresql/18/docker

  # E-mails do perfil dev (recuperação de senha) caem aqui: caixa de entrada em http://localhost:8025.
  mailpit:
    image: 'axllent/mailpit:v1.32'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  contadinho-db:
